# Re-run build to regenerate and publish the APK/ZIP deliverables.
name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'downloads/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Decode icon source
        run: bash scripts/decode_icons.sh

      - name: Generate all launcher densities
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow
          python scripts/generate_icons.py

      - name: Install Gradle
        run: |
          curl --fail --show-error --silent --location https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare named deliverables
        if: success()
        run: |
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" TerraAltis.apk
          mkdir -p zip-package
          cp TerraAltis.apk zip-package/TerraAltis.apk
          (cd zip-package && zip -q ../TerraAltis.zip TerraAltis.apk)
          ls -lh TerraAltis.apk TerraAltis.zip
          unzip -l TerraAltis.zip

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: TerraAltis-APK
          path: TerraAltis.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish release with named files
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: build-${{ github.run_number }}
          name: TerraAltis build ${{ github.run_number }}
          generate_release_notes: true
          files: |
            TerraAltis.apk
            TerraAltis.zip

      - name: Commit ZIP to repository for direct download
        if: success()
        run: |
          mkdir -p downloads
          cp TerraAltis.zip downloads/TerraAltis.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/TerraAltis.zip
          if git diff --cached --quiet; then
            echo "El ZIP no cambió; no hace falta crear otro commit."
          else
            git commit -m "Add TerraAltis APK ZIP download"
            git push origin HEAD:main
          fi
